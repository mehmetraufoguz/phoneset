name: release

# Push a tag like v0.2.0 to publish binaries: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    # The CoreAudio backend uses cgo (Objective-C), so it has to be built on a Mac.
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/go.mod
      - name: Build
        working-directory: pc
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA}" -o phoneset ./cmd/phoneset
      - run: tar -czf phoneset-macos-${{ matrix.arch }}.tar.gz -C pc phoneset
      - uses: actions/upload-artifact@v4
        with:
          name: phoneset-macos-${{ matrix.arch }}
          path: phoneset-macos-${{ matrix.arch }}.tar.gz

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/go.mod
      - name: Build
        working-directory: pc
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA}" -o phoneset.exe ./cmd/phoneset
      - run: Compress-Archive -Path pc/phoneset.exe -DestinationPath phoneset-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: phoneset-windows-${{ matrix.arch }}
          path: phoneset-windows-${{ matrix.arch }}.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum phoneset-* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
