name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pc:
    # Windows runner: the WASAPI backend is compiled natively here.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/go.mod
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-s -w" -o phoneset.exe ./cmd/phoneset
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: phoneset-windows
          path: pc/phoneset.exe

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
