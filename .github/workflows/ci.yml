name: ci

# CI runs only when the commit message contains "!release" (a pull request: its title), or when it is
# started by hand from the Actions tab. Only the last commit of a push is looked at. Without the marker
# every job is skipped and no runner is used. Releases are built by release.yml, which a version tag starts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '!release') || contains(github.event.pull_request.title, '!release')
    # Windows runner: the WASAPI backend is compiled natively here.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/go.mod
      - run: go vet ./...
      - name: Check that the Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/../scripts/install-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - run: go build -trimpath -ldflags "-s -w" -o phoneset.exe ./cmd/phoneset
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: phoneset-windows
          path: pc/phoneset.exe

  pc-macos:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '!release') || contains(github.event.pull_request.title, '!release')
    # The CoreAudio backend uses cgo (Objective-C), so it needs a Mac to build on.
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/go.mod
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-s -w" -o phoneset ./cmd/phoneset
      - uses: actions/upload-artifact@v4
        with:
          name: phoneset-macos-${{ matrix.arch }}
          path: pc/phoneset

  mobile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '!release') || contains(github.event.pull_request.title, '!release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh -n scripts/install-mac.sh
      - run: pnpm check
      - run: pnpm typecheck
